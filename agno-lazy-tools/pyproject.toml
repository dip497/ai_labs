[project]
name = "agno-lazy-tools"
version = "0.1.0"
description = "POC: lazy (on-demand) tool loading for Agno agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Pinned: the model hooks rely on Agno internals (see README, "Trade-offs").
    "agno==3.0.11",
]

[project.optional-dependencies]
openai = ["openai>=1.106.0"]
anthropic = ["anthropic>=0.77.0"]

[dependency-groups]
# The provider SDKs let the tests drive Agno's real OpenAI / Claude adapters against a local mock server.
dev = ["pytest>=8", "openai>=1.106.0", "anthropic>=0.77.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
